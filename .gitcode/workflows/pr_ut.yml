name: UT Job

on:
  workflow_call:
    inputs:
      docker_img:
        required: true
        type: string
      module:
        required: true
        type: string
      pr_id:
        required: true
        type: string
      target_branch:
        required: false
        type: string
jobs:
  JOB_Compile:
    name: Compile
    select: selected_by_default
    runs-on: [self-hosted, os=euler, arch=arm64, type=pr, flavor=large]
    container:
      image: ${{ inputs.docker_img }}
    steps:
      # save 端 key 每次运行唯一且不给 restore-keys，靠"全部未命中即落盘"写新缓存；restore 端精确 key 故意永不等于 save 端，只靠前缀取最近一份
      - name: ccache_tag
        id: cct
        run: |-
          printf 'tag=%s\n' "${ATOMGIT_RUN_ID:-$(date +%s)}" >> "$ATOMGIT_OUTPUT"
      - name: restore_ccache
        uses: cache
        with:
          path: /home/jenkins/agent/build_cache/.ccache
          key: ccache-${{ inputs.module }}-ut-hit-${{ steps.cct.outputs.tag }}
          restore-keys: |
            ccache-${{ inputs.module }}-ut-
      - name: fast_checkout
        identifier: fast_checkout
        uses: checkout
        with:
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge
          path: velox # 脚本以 ${WORKSPACE}/velox 引用源码，目录名需固定
      - name: build
        run: |-
          if [ -f velox/.gitcode/scripts/build.sh ]; then
            bash velox/.gitcode/scripts/build.sh ut
          else
            echo "ERROR: build.sh 在预合入代码中均不存在"; exit 1
          fi
      - name: save_ccache
        uses: cache
        with:
          path: /home/jenkins/agent/build_cache/.ccache
          key: ccache-${{ inputs.module }}-ut-${{ steps.cct.outputs.tag }}
